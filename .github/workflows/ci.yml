name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=catalyst --cov-report=term-missing
      - run: PYTHONPATH=src python -m catalyst.demo
      - run: PYTHONPATH=src python -m catalyst.replay_demo
      - run: >-
          PYTHONPATH=src python -m catalyst.validation_cli
          config/validation.example.json /tmp/catalyst-validation
          --strategy-version synthetic-ci --iterations 20
      - run: python -m compileall -q src tests scripts
      - run: python scripts/release_verify.py
