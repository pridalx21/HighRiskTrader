[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-mvp"
version = "0.1.0"
description = "Demo-only event-conditioned trading system MVP starter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - private research project" }
authors = [{ name = "CATALYST project" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
mt5 = ["MetaTrader5>=5.0"]
ui = ["plotly>=5.24,<7", "streamlit>=1.40,<2"]

[project.scripts]
catalyst-demo = "catalyst.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["catalyst"]
# External adapters and command entry points have explicit contract/command tests;
# the 85% aggregate gate measures the deterministic executable core.
omit = [
  "src/catalyst/adapters/mt5_broker.py",
  "src/catalyst/demo.py",
  "src/catalyst/replay_demo.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
